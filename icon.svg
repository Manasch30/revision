<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" rx="112" fill="#09090b"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#27272a" stroke-width="4"/>

  <!-- Spaced curve waves in crisp white & silver -->
  <path d="M 80 340 Q 140 220 200 280 T 320 200 T 440 140" fill="none" stroke="#ffffff" stroke-width="14" stroke-linecap="round"/>

  <!-- Retention nodes -->
  <circle cx="80" cy="340" r="14" fill="#71717a" stroke="#09090b" stroke-width="4"/>
  <circle cx="200" cy="280" r="14" fill="#a1a1aa" stroke="#09090b" stroke-width="4"/>
  <circle cx="320" cy="200" r="14" fill="#d4d4d8" stroke="#09090b" stroke-width="4"/>
  <circle cx="440" cy="140" r="16" fill="#ffffff" stroke="#09090b" stroke-width="4"/>

  <!-- Dashed vertical projection lines -->
  <path d="M 80 340 L 140 220" fill="none" stroke="#52525b" stroke-width="4" stroke-dasharray="8 6"/>
  <path d="M 200 280 L 260 170" fill="none" stroke="#71717a" stroke-width="4" stroke-dasharray="8 6"/>
  <path d="M 320 200 L 380 110" fill="none" stroke="#a1a1aa" stroke-width="4" stroke-dasharray="8 6"/>

  <!-- Bottom retrieval node -->
  <g transform="translate(256, 390)">
    <circle cx="0" cy="0" r="28" fill="#27272a"/>
    <circle cx="0" cy="0" r="16" fill="#ffffff"/>
    <path d="M -6 1 L -2 5 L 7 -4" fill="none" stroke="#09090b" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
